<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockPro F&O Analytics — Real-time Screener & Derivatives Matrix</title>
    <link rel="icon" href="https://ui-avatars.com/api/?name=SP&color=10b981&background=020617&size=32&bold=true" type="image/png">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=SP&color=10b981&background=020617&size=180&bold=true">
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #030712; /* Slate 950 ultra dark background */
        color: #f3f4f6;
      }
      /* Custom elite theme dark scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #030712;
      }
      ::-webkit-scrollbar-thumb {
        background: #1f2937;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #374151;
      }

      /* Pure-CSS High-End Brand Loader */
      #page-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #020617; /* Dark elegant Slate 950 canvas */
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .loader-logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .loader-icon {
        width: 52px;
        height: 52px;
        background-color: #2563eb; /* StockPro active blue */
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        box-shadow: 0 4px 20px rgba(37, 99, 235, 0.45);
      }
      .loader-text {
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 900;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: -0.025em;
      }
      .loader-subtext {
        font-family: 'Inter', sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        color: #10b981; /* Accent emerald green */
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-top: -6px;
      }
      .loader-track {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background-color: rgba(255, 255, 255, 0.05);
      }
      .loader-bar {
        height: 100%;
        background-color: #10b981;
        width: 0%;
        animation: loadProgress 1.5s ease-in-out forwards;
      }
      @keyframes loadProgress {
        from { width: 0% }
        to { width: 100% }
      }
    </style>
    <script type="module" crossorigin src="/assets/screener-DcMsd7AC.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/screener-D2KgaP6U.css">
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased select-none font-sans">
    <!-- Brand Page Loader Overlay (1.5 seconds) -->
    <div id="page-loader">
      <div class="loader-logo-container">
        <div class="loader-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
        </div>
        <div class="loader-text">StockPro Screener</div>
        <div class="loader-subtext">Pro Derivatives Terminal</div>
      </div>
      <div class="loader-track">
        <div class="loader-bar"></div>
      </div>
    </div>

    <script>
      // Manage Brand Loader active cycle
      setTimeout(function() {
        var loader = document.getElementById('page-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() {
            loader.style.display = 'none';
          }, 400);
        }
      }, 1500);
    </script>
    <div id="root"></div>
  </body>
</html>
