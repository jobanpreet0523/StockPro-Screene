name = "stockpro-screener"
compatibility_date = "2024-12-01"
main = "src/_worker.js"

[assets]
not_found_handling = "single-page-application"
directory = "./dist"
binding = "ASSETS"

# KV namespace for caching NSE data (60s TTL)
# To enable: run `npx wrangler kv namespace create STOCKPRO_KV`
# Then add the id below and uncomment
# [[kv_namespaces]]
# binding = "STOCKPRO_KV"
# id = "YOUR_KV_NAMESPACE_ID"
