name = "stockpro-screener"
compatibility_date = "2026-06-15"
main = "src/_worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
MARKET_DATA_PROVIDER = "delayed"

# KV namespace for caching NSE data (60s TTL)
# To enable: run `npx wrangler kv namespace create STOCKPRO_KV`
# Then add the id below and uncomment
# [[kv_namespaces]]
# binding = "STOCKPRO_KV"
# id = "YOUR_KV_NAMESPACE_ID"
