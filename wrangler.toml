name = "stockpro-screener"
compatibility_date = "2024-12-01"
main = "src/_worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"

# KV namespace for caching NSE data (60s TTL)
# Create with: npx wrangler kv namespace create STOCKPRO_KV
# Then paste the id below
[[kv_namespaces]]
binding = "STOCKPRO_KV"
id = ""  # Will be set after KV namespace creation
