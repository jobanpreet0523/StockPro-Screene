name: Repair Package Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Repair and verify package lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci

      - name: Run repository checks
        run: |
          npm run verify:agents
          npm run typecheck
          npm run security:scan
          npm run build
          npm run verify:launch
          npm run smoke:routes
          npm run seo:audit
          npm run seo:sitemap

      - name: Detect repaired package lock
        id: lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload repaired lockfile for reviewed PR
        if: steps.lockfile.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
