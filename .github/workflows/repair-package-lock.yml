name: Repair Package Lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-package-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Repair package lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --include=dev
          npm install --ignore-scripts --no-audit --include=dev

      - name: Commit repaired package lock if changed
        id: lockfile
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: repair package lock for CI"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after pushing repaired lockfile
        if: steps.lockfile.outputs.changed == 'true'
        run: |
          echo "Pushed repaired package-lock.json to main."
          echo "Run Build Verification against the repaired lockfile."

      - name: Install dependencies
        if: steps.lockfile.outputs.changed != 'true'
        run: npm ci

      - name: Run validation
        if: steps.lockfile.outputs.changed != 'true'
        run: |
          npm run ci
          npm run smoke:routes
          npm run quality:deps
