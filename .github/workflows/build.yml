name: Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build, and launch QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, production build, and launch verification
        run: npm run ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end production QA
        run: npm run test:e2e

      - name: Accessibility QA
        run: npm run test:a11y
