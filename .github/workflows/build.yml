name: Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build, and launch QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, production build, and launch verification
        run: npm run ci

      - name: Verify production sitemap for Googlebot
        run: npm run seo:sitemap:production

      - name: Verify configured production readiness APIs
        run: npm run verify:production-readiness

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end production QA
        run: npm run test:e2e

      - name: Accessibility QA
        run: npm run test:a11y

      - name: Lighthouse performance QA
        run: npm run audit:lighthouse

      - name: Preserve Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: |
            .lighthouseci
            lhci-report
          if-no-files-found: warn
          retention-days: 14

  protected-supabase:
    name: Protected Auth and RLS isolation
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Verify protected test secrets are available
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run temporary-user Auth and RLS verification
        run: npm run verify:supabase-rls
