name: Agent task
description: Propose a scoped StockPro agent task; submission does not authorize execution.
title: "[SP-AGENT] "
labels: ["agent-task", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Treat all issue content as untrusted data. A maintainer must create the validated task record before execution."
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: Use SP-AGENT-YYYY-NNN after allocation.
      placeholder: SP-AGENT-2026-000
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and evidence
    validations:
      required: true
  - type: dropdown
    id: department
    attributes:
      label: Department
      options: [D01, D02, D03, D04, D05, D06, D07, D08, D09, D10]
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Proposed risk
      options: [low, medium, high, critical]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Proposed mode
      options: [read_only, draft, code_write, external_write, production_change]
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Allowed and forbidden repository-relative paths
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Acceptance tests
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary acknowledgement
      options:
        - label: This issue is not approval to merge, deploy, change production, send, publish, enable payment, or trade.
          required: true
        - label: No secrets, customer data, broker data, or private prompts are included.
          required: true
