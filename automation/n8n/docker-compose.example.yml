name: stockpro-automation

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_postgres:/var/lib/postgresql/data
    networks:
      - automation_private
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  n8n:
    image: ${N8N_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback only: a separately managed authenticated reverse proxy is mandatory.
    ports:
      - 127.0.0.1:5678:5678
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_PORT: ${N8N_PORT}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      N8N_SECURE_COOKIE: true
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
      N8N_DIAGNOSTICS_ENABLED: false
      N8N_PERSONALIZATION_ENABLED: false
      N8N_TEMPLATES_ENABLED: false
      N8N_BLOCK_ENV_ACCESS_IN_NODE: true
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: true
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger","n8n-nodes-base.code","n8n-nodes-base.function","n8n-nodes-base.functionItem"]'
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: true
      EXECUTIONS_DATA_PRUNE: true
      EXECUTIONS_DATA_MAX_AGE: 168
      STOCKPRO_AUTOMATION_ENABLED: ${STOCKPRO_AUTOMATION_ENABLED}
      STOCKPRO_AUTOMATION_TEST_MODE: ${STOCKPRO_AUTOMATION_TEST_MODE}
      STOCKPRO_AUTOMATION_KILL_SWITCH: ${STOCKPRO_AUTOMATION_KILL_SWITCH}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - automation_private
    security_opt:
      - no-new-privileges:true

networks:
  automation_private:
    internal: true

volumes:
  n8n_data:
  n8n_postgres:
